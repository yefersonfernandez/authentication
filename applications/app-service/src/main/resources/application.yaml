server:
  port: ${SERVER_PORT}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH}

spring:
  application:
    name: "authentication"
  devtools:
    add-properties: false

management:
  endpoints:
    web:
      base-path: ${SERVER_ACTUATOR_PATH}
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

adapters:
  r2dbc:
    host: ${SPRING_R2DBC_HOST_AUTH}
    port: ${SPRING_R2DBC_PORT_AUTH}
    database: ${SPRING_R2DBC_DATABASE_AUTH}
    schema: ${SPRING_R2DBC_SCHEMA_AUTH}
    username: ${SPRING_R2DBC_USERNAME_AUTH}
    password: ${SPRING_R2DBC_PASSWORD_AUTH}

springdoc:
  swagger-ui:
    path: "/auth/api/doc/swagger-ui.html"
  api-docs:
    path: "/auth/api/doc/api-docs"

routes:
  paths:
    users: "/auth/api/v1/users"
    userByIdentityDocument: "/auth/api/v1/users/userByIdentityDocument/{identityDocument}"
    userByEmail: "/auth/api/v1/users/userByEmail/{email}"
    login: "/auth/api/v1/login"

security:
  jwt:
    keys:
      private: ${JWT_PRIVATE_KEY}
      public: ${JWT_PUBLIC_KEY}
    expiration: ${JWT_EXPIRATION}
